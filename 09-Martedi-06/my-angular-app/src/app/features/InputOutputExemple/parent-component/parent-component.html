<h2>Lista Prodotti</h2>

@for (prodotto of prodotti; track prodotto.nome) {
  <app-child-component
    [nome]="prodotto.nome"
    [prezzo]="prodotto.prezzo"
    [disponibile]="prodotto.disponibile">
  </app-child-component>
}
