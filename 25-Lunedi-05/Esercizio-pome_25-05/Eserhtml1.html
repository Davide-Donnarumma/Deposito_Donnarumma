<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Nuovi Giocattoli</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="Esercss.css">
    </head>
<body>
    <div class="container">
        <header>
            <h1>Negozio di Giocattoli</h1>
            <p>Gestione Inventario - Inserimento Prodotti</p>
        </header>

        <nav>
            <a href="Eserhtml1.html" class="active">Nuovo Giocattolo</a>
            <a href="Eserhtml2.html">Vedi Elenco</a>
            <a href="Eserhtml3.html">Riepilogo Statistiche</a>
        </nav>

        <section class="card">
            <form id="toyForm">
                <label for="nome">Nome Giocattolo:</label>
                <input type="text" id="nome" required placeholder="Es. Robot Radiocomandato">

                <label for="categoria">Categoria:</label>
                <select id="categoria">
                    <option value="Costruzioni">Costruzioni</option>
                    <option value="Giochi da Tavolo">Giochi da Tavolo</option>
                    <option value="Bambole">Bambole</option>
                    <option value="Elettronici">Elettronici</option>
                </select>

                <label for="prezzo">Prezzo (€):</label>
                <input type="number" id="prezzo" step="0.01" required placeholder="Es. 24.99">

                <label for="eta">Età Consigliata:</label>
                <input type="number" id="eta" required placeholder="Es. 6">

                <label for="disponibile">Disponibilità:</label>
                <select id="disponibile">
                    <option value="si">Disponibile</option>
                    <option value="no">Non Disponibile</option>
                </select>

                <button type="submit">Salva Giocattolo</button>
            </form>
        </section>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
