<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Info - Amici a 4 Zampe</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="Style.css">
    </head>
<body>

    <header>
        <div class="logo">🐾 Amici a 4 Zampe</div>
        <button id="btnHamburger" class="hamburger">☰</button>
        <nav id="menuNavigazione" class="menu-principale">
            <a href="Home.html">Home</a>
            <a href="I nostri cani.html">I Nostri Cani</a>
            <a href="Info.html" class="active">Info & Adotta</a>
        </nav>
    </header>

    <main class="layout-centrale">
        <section class="hero">
            <h1>Richiesta di Adozione</h1>
            <p>Compila il modulo sottostante per iniziare il percorso di adozione. Verrai ricontattato dai nostri esperti.</p>
        </section>

        <div class="modulo-inserimento">
            <h2>Modulo di Contatto</h2>
            <form id="formAdozione">
                <label for="nome">Nome e Cognome:</label>
                <input type="text" id="nome" required>

                <label for="email">Tua Email:</label>
                <input type="email" id="email" required>

                <label for="telefono">Telefono:</label>
                <input type="tel" id="telefono" required>

                <label for="caneScelto">Cane a cui sei interessato:</label>
                <select id="caneScelto" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="generale">Informazioni generali</option>
                    <option value="max">Max</option>
                    <option value="luna">Luna</option>
                    <option value="rocky">Rocky</option>
                </select>

                <label for="messaggio">Perché vuoi adottare un cane?</label>
                <textarea id="messaggio" rows="4" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;"></textarea>

                <button type="submit" class="btn-principale" style="width: 100%; margin-top: 20px;">Invia Richiesta</button>
            </form>
            <div id="areaMessaggio"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Centro Adozioni Amici a 4 Zampe. Tutti i diritti riservati.</p>
    </footer>

    <script src="Script.js"></script>
</body>
</html>
